# AWS CodeBuild build specification.
# Pulls the Python base image, installs dependencies (in the Docker build),
# and pushes the resulting custom image to Amazon ECR.
#
# Required environment variables (set on the CodeBuild project by Terraform):
#   AWS_ACCOUNT_ID    - target account id
#   AWS_DEFAULT_REGION- provided automatically by CodeBuild
#   IMAGE_REPO_NAME   - ECR repository name
#   IMAGE_TAG         - image tag (defaults to "latest")
version: 0.2

phases:
  pre_build:
    commands:
      - aws --version
      - REGION="${AWS_DEFAULT_REGION}"
      - ACCOUNT="${AWS_ACCOUNT_ID}"
      - IMAGE_TAG="${IMAGE_TAG:-latest}"
      - REPO_URI="${ACCOUNT}.dkr.ecr.${REGION}.amazonaws.com/${IMAGE_REPO_NAME}"
      - echo "Logging in to ECR ${REPO_URI}"
      - aws ecr get-login-password --region "${REGION}" | docker login --username AWS --password-stdin "${ACCOUNT}.dkr.ecr.${REGION}.amazonaws.com"
  build:
    commands:
      - echo "Building image ${REPO_URI}:${IMAGE_TAG}"
      - docker build -t "${REPO_URI}:${IMAGE_TAG}" -t "${REPO_URI}:latest" .
  post_build:
    commands:
      - echo "Pushing image to ECR"
      - docker push "${REPO_URI}:${IMAGE_TAG}"
      - docker push "${REPO_URI}:latest"
      - printf '{"image":"%s:%s"}' "${REPO_URI}" "${IMAGE_TAG}" > image.json
      - cat image.json

artifacts:
  files:
    - image.json
